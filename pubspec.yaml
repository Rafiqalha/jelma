name: uts_jelajah_malang
description: "Jelajah Malang (JELMA): katalog destinasi wisata Malang Raya. UTS: katalog dan navigasi. UAS: lokasi dinamis, cuaca, rencana kunjungan, dan notifikasi."
publish_to: 'none'
version: 2.1.0+3

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  geolocator: ^14.1.2
  geocoding: ^5.0.1
  shared_preferences: ^2.5.6
  flutter_local_notifications: ^23.0.4
  timezone: ^0.11.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/destinasi.json
    # Foto destinasi dari Wikimedia Commons; kredit lengkap ada di destinasi.json dan halaman Kredit foto.
    - assets/images/destinasi/

  # Plus Jakarta Sans oleh Tokotype, SIL Open Font License 1.1 (assets/fonts/OFL.txt).
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
